# CI for the standalone repository. While this project is vendored inside a
# host repo, GitHub ignores this file (only the root .github/ is read).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Same rule as the local .githooks/commit-msg hook.
      - name: Lint commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            range="-1 HEAD"
          else
            range="${{ github.event.before }}..${{ github.event.after }}"
          fi
          status=0
          for sha in $(git rev-list --no-merges $range); do
            git log -1 --format=%B "$sha" > /tmp/msg
            if ! ./.githooks/commit-msg /tmp/msg; then
              echo "::error::commit $sha failed the message check"
              status=1
            fi
          done
          exit $status

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # build runs ExampleProjectTest, which drives every example end to end:
      # target selection, forks and the reports. The runner image carries an
      # Android SDK, so the Android examples run here too.
      - name: Build and test (jvm + linuxX64 + examples)
        run: ./gradlew spotlessCheck build :kaputt-runtime:linuxX64Test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-test-reports
          path: '**/build/reports/tests/**'

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The same examples, but the multiplatform one measures macosArm64 here.
      - name: Build and test (jvm + apple targets)
        run: ./gradlew build :kaputt-runtime:macosArm64Test :kaputt-runtime:compileKotlinIosSimulatorArm64
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-test-reports
          path: '**/build/reports/tests/**'
